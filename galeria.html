        .galeria {

        .galeria img {
            width: 240px;
            height: 170px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid #a5d6a7;
            box-shadow: 0 5px 10px #999;
            transition: all 0.3s ease;
        }
        .galeria img:hover {
            transform: scale(1.1);
            border-color: #81c784;
            box-shadow: 0 12px 24px #a8dbb6;
            cursor: pointer;
        }

            padding: 12px 20px;

            border-radius: 10px;
            display: inline-block;
        }
        nav a:hover {
            background-color: rgb(255, 0, 130);
            color: rgb(255, 255, 255);
        }
